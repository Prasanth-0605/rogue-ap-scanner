[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rogue-ap-hunter"
version = "0.1.0"
description = "Detect rogue Wi-Fi access points with a modern Textual TUI, iw scanning, and SQLite storage."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RogueAPHunter" }]
license = { text = "MIT" }
keywords = ["wifi", "rogue-ap", "textual", "iw", "security", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]

dependencies = [
    "textual>=8.0",
]

[project.scripts]
raphunter = "rogue_ap_hunter.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rogue_ap_hunter*"]

[tool.setuptools.package-data]
rogue_ap_hunter = ["tui/*.tcss"]
